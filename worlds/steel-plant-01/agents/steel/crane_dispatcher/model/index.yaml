$schema: https://agent-studio.io/schema/v2
metadata:
  name: crane_dispatcher
  title: 天车调度员
  description: 负责天车的任务分配和路径协调

attributes:
  maxCraneCount:
    type: number
    default: 7
    description: 最大天车数量

variables:
  activeTasks:
    type: number
    default: 0
    description: 当前活跃任务数
  pendingTasks:
    type: number
    default: 0
    description: 待处理任务数

states:
  idle:
    title: 待机
    description: 等待天车调度请求
    group: workState
    initialState: true
  dispatching:
    title: 调度中
    description: 正在分配天车
    group: workState

transitions:
  startDispatch:
    title: 开始调度
    from: idle
    to: dispatching
  endDispatch:
    title: 调度完成
    from: dispatching
    to: idle

behaviors:
  onCraneRequest:
    title: 天车请求
    trigger:
      type: event
      name: crane.request
      when: payload.get("targetId") is None or payload.get("targetId") == this.id
    actions:
      - type: runScript
        scriptEngine: python
        script: |
          fromPos = payload.get("from", "")
          toPos = payload.get("to", "")
          ladleId = payload.get("ladleId", "")
          priority = payload.get("priority", 0)

          taskId = lib.crane_dispatch.create_task(fromPos, toPos, ladleId, priority)
          print(f"[{this.id}] 创建任务 {taskId} | {fromPos} -> {toPos} | 钢包={ladleId}")

          # 全局重分配
          cranes = world_state.crane
          assignments = lib.crane_dispatch.global_dispatch(cranes)
          newAssignments = lib.crane_dispatch.apply_dispatch(assignments)

          # 更新计数
          totalAssigned = sum(len(plans) for plans in assignments.values())
          this.variables.activeTasks = totalAssigned
          allPending = lib.crane_dispatch.list_pending_tasks()
          this.variables.pendingTasks = len(allPending)

          # 向天车发送新分配的任务
          for craneId, taskIds in newAssignments.items():
              for tid in taskIds:
                  task = lib.crane_dispatch.get_task_by_id(tid)
                  dispatch("crane.task.assign", {
                      "targetId": craneId,
                      "taskId": tid,
                      "from": task["from_pos"],
                      "to": task["to_pos"],
                      "ladleId": task["ladle_id"]
                  })
                  print(f"[{this.id}] 分配任务 {tid} -> 天车 {craneId}")
      - type: transition
        transition: startDispatch

  onCraneTaskCompleted:
    title: 天车任务完成
    trigger:
      type: event
      name: crane.task.completed
      when: payload.get("targetId") is None or payload.get("targetId") == this.id
    actions:
      - type: runScript
        scriptEngine: python
        script: |
          taskId = payload.get("taskId", "")
          craneId = payload.get("craneId", "")
          lib.crane_dispatch.complete_task(taskId)
          task = lib.crane_dispatch.get_task_by_id(taskId)
          print(f"[{this.id}] 任务 {taskId} 完成 | 天车={craneId}")

          # 检查是否是跨 bay 源段，触发过跨车
          if task and task.get("task_type") == "cross_bay_source":
              bayInfo = lib.crane_dispatch.get_task_bays(taskId)
              fromBay = bayInfo.get("from_bay") if bayInfo else None
              toBay = bayInfo.get("to_bay") if bayInfo else None
              route = f"{fromBay}:{toBay}" if fromBay and toBay else ""

              trolleys = world_state.trolley
              for t in trolleys:
                  if t.get("route") == route and t.get("state") == "idle":
                      dispatch("trolley.task.assign", {
                          "targetId": t["id"],
                          "taskId": taskId,
                          "targetBay": toBay
                      })
                      print(f"[{this.id}] 触发过跨车 {t['id']} | 路线={route}")
                      break

          # 全局重分配
          cranes = world_state.crane
          assignments = lib.crane_dispatch.global_dispatch(cranes)
          newAssignments = lib.crane_dispatch.apply_dispatch(assignments)

          # 更新计数
          totalAssigned = sum(len(tasks) for tasks in assignments.values())
          this.variables.activeTasks = totalAssigned
          allPending = lib.crane_dispatch.list_pending_tasks()
          this.variables.pendingTasks = len(allPending)

          # 向天车发送新分配的任务
          for cid, taskIds in newAssignments.items():
              for tid in taskIds:
                  task = lib.crane_dispatch.get_task_by_id(tid)
                  dispatch("crane.task.assign", {
                      "targetId": cid,
                      "taskId": tid,
                      "from": task["from_pos"],
                      "to": task["to_pos"],
                      "ladleId": task["ladle_id"]
                  })
                  print(f"[{this.id}] 分配任务 {tid} -> 天车 {cid}")
      - type: transition
        transition: endDispatch

  onTrolleyArrived:
    title: 过跨车到达
    trigger:
      type: event
      name: trolley.arrived
      when: payload.get("targetId") is None or payload.get("targetId") == this.id
    actions:
      - type: runScript
        scriptEngine: python
        script: |
          trolleyId = payload.get("trolleyId", "")
          taskId = payload.get("taskId", "")
          bay = payload.get("bay", "")
          print(f"[{this.id}] 过跨车 {trolleyId} 到达 {bay} | 任务={taskId}")

          # 创建目标段子任务
          targetTaskId = lib.crane_dispatch.create_target_task(taskId)
          if targetTaskId:
              print(f"[{this.id}] 创建目标段任务 {targetTaskId}")

              # 调度目标 bay 天车
              cranes = world_state.crane
              assignments = lib.crane_dispatch.global_dispatch(cranes)
              newAssignments = lib.crane_dispatch.apply_dispatch(assignments)

              for cid, tids in newAssignments.items():
                  for tid in tids:
                      task = lib.crane_dispatch.get_task_by_id(tid)
                      dispatch("crane.task.assign", {
                          "targetId": cid,
                          "taskId": tid,
                          "from": task["from_pos"],
                          "to": task["to_pos"],
                          "ladleId": task["ladle_id"]
                      })
                      print(f"[{this.id}] 分配任务 {tid} -> 天车 {cid}")

          # 更新计数
          totalAssigned = sum(len(plans) for plans in assignments.values())
          this.variables.activeTasks = totalAssigned
          allPending = lib.crane_dispatch.list_pending_tasks()
          this.variables.pendingTasks = len(allPending)

  onCraneReleased:
    title: 天车释放
    trigger:
      type: event
      name: crane.released
      when: payload.get("targetId") is None or payload.get("targetId") == this.id
    actions:
      - type: runScript
        scriptEngine: python
        script: |
          craneId = payload.get("craneId", "")
          print(f"[{this.id}] 天车释放 | 天车={craneId}")
          # 触发全局重分配
          cranes = world_state.crane
          assignments = lib.crane_dispatch.global_dispatch(cranes)
          lib.crane_dispatch.apply_dispatch(assignments)
          totalAssigned = sum(len(tasks) for tasks in assignments.values())
          this.variables.activeTasks = totalAssigned
